<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NOC-RELEVOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-brand">🎡 Ruleta de relevos</div>
    <p class="login-sub">Identifícate para entrar</p>
    <form id="loginForm">
      <input type="text" id="loginUser" placeholder="Usuario" autocomplete="username" required>
      <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Entrar</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
</div>

<div class="topbar" id="topbarOuter" style="display:none;">
  <div class="topbar-inner">
    <div class="topbar-user">👤 <span id="topbarUser">—</span> <span id="adminBadge" class="admin-badge" style="display:none;">admin</span></div>
    <div class="topbar-title">NOC-RELEVOS RANDOMIZADOR</div>
    <div class="topbar-actions"><button class="btn-green" id="logoutBtn">🚪Cerrar sesión</button></div>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">

  <div class="grid">

    <div class="wheel-col">
      <div class="wheel-stage">
        <div class="wheel-core">
          <div class="pointer"></div>
          <div class="wheel-ring" id="wheelRing"></div>
          <svg id="wheel" viewBox="0 0 300 300"></svg>
          <div class="hub">
            <div class="clock" id="clock">00:00</div>
          </div>
        </div>
      </div>

      <button class="spin-btn" id="spinBtn">GIRAR</button>

      <div class="result-wrap">
        <img src="pingu.gif" class="pingu" alt="Pingu vigilando el relevo">
        <div class="result-card" id="resultCard">
          <div class="result-label" id="resultLabel">da el relevo</div>
          <div class="result-name" id="resultName">—</div>
          <div class="result-meta" id="resultMeta"> </div>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>Equipo <span id="teamCount">11 en turno</span></h2>
        <div class="person-grid" id="namesGrid"></div>
      </div>

      <div class="panel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="resumen">Resumen</button>
          <button class="tab-btn" data-tab="misgiros">Mis giros</button>
          <button class="tab-btn" data-tab="todos">Todos los giros</button>
          <span class="tab-indicator" id="tabIndicator"></span>
        </div>

        <div class="tab-panel active" id="tabResumen">
          <div id="summaryBars"></div>
        </div>

        <div class="tab-panel" id="tabMisgiros">
          <div class="hist-wrap">
            <table>
              <thead><tr><th style="width:32%">Fecha</th><th style="width:20%">Turno</th><th>Relevo</th></tr></thead>
              <tbody id="misGirosBody">
                <tr class="empty-row"><td colspan="3">Aún no has girado</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="tab-panel" id="tabTodos">
          <div class="hist-wrap">
            <table>
              <thead><tr><th style="width:26%">Fecha</th><th style="width:15%">Turno</th><th>Relevo</th><th style="width:18%">Girado por</th></tr></thead>
              <tbody id="histBody">
                <tr class="empty-row"><td colspan="4">Aún no hay giros registrados</td></tr>
              </tbody>
            </table>
          </div>
          <div class="actions" id="adminActions" style="margin-top:16px;display:none;">
            <button class="btn-green" id="sheetBtn">📊 BBDD</button>
            <button class="btn-green" id="resetBtn">🚮 Limpiar historial</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="footerbar" id="footerbarOuter" style="display:none;">
  <div class="footerbar-inner">Tu herramienta ⭐ para cuando el resto se queda en 🤫 · <span id="footerVersion">v2.6</span></div>
</div>

<script src="script.js"></script>
</body>
</html>
